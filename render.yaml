services:
  - type: web
    name: neat-notes
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: neat-notes-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/neat-notes.sqlite
      - key: JSON_BODY_LIMIT
        value: 1mb
      - key: AUTH_RATE_LIMIT
        value: "25"
      - key: JOIN_RATE_LIMIT
        value: "12"
      - key: REVISION_RATE_LIMIT
        value: "90"
      - key: BILLING_RATE_LIMIT
        value: "12"
      - key: MAX_NOTE_BODY_BYTES
        value: "98304"
      - key: MAX_NOTE_VERSIONS
        value: "40"
      - key: MAX_NOTE_VERSION_BYTES
        value: "1048576"
      - key: CONTACT_TO
        value: neatnotescontact@gmail.com
      - key: CONTACT_RATE_LIMIT
        value: "8"
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TEACHER
        sync: false
      - key: STRIPE_PRICE_INSTITUTION
        sync: false
      - key: ALLOW_MOCK_BILLING
        value: "false"
      - key: FREE_REVISION_DECK_LIMIT
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
